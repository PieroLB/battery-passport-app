# Production (VPS). Run with: docker compose --env-file .env.production -f docker-compose.prod.yml ...
services:
  web: # Caddy + static SPA + Caddyfile, all in the image (ADR 0002)
    image: ghcr.io/${GHCR_OWNER}/battery-passport-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    image: ghcr.io/${GHCR_OWNER}/battery-passport-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false # the API refuses to start anyway if a variable is missing
    environment:
      NEO4J_URI: bolt://neo4j:7687
      API_PORT: '3000'
      ARCHIVE_DIR: /data/archives
      ARCHIVE_BACKUP_DIR: /data/backup
    volumes:
      - archives:/data/archives
      - archives_backup:/data/backup
    depends_on:
      neo4j: { condition: service_healthy }

  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    # NO published port: Neo4j stays on the internal Docker network.

volumes:
  caddy_data:
  caddy_config:
  neo4j_data:
  archives:
  archives_backup:
