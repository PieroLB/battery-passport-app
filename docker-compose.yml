# Development: Neo4j only (api and web run with `pnpm dev`).
services:
  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5-community} # Neo4j 5 LTS
    ports: ['127.0.0.1:7474:7474', '127.0.0.1:7687:7687']
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devpassword}
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
